services:
  resource_server:
    image: nginx:alpine
    container_name: resource_server
    volumes:
      - ./resource_content:/usr/share/nginx/html
    restart: unless-stopped

  auth_service:
    build: ./auth_service
    container_name: auth_service
    volumes:
      - ./auth_service:/app
      - ./wg_config:/config
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/zerotrust_db
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: zt_postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=zerotrust_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  gateway:
    build: ./frontend
    container_name: gateway
    ports:
      - "8095:80"
    volumes:
      - ./gateway_config/nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped

  wg_server:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wg_server
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bucharest
      - SERVERURL=auto # Will try to determine IP
      - SERVERPORT=51820
      - PEERS=0 # We manage peers manually
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0
      - ALLOWEDIPS=0.0.0.0/0
    volumes:
      - ./wg_config:/config
      - /lib/modules:/lib/modules # Optional for kernel mode
    ports:
      - "51820:51820/udp"
    restart: unless-stopped



volumes:
  postgres_data:
