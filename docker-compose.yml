services:
  resource_server:
    image: nginx:alpine
    container_name: resource_server
    volumes:
      - ./resource_content:/usr/share/nginx/html
    restart: unless-stopped

  pdp:
    build: ./pdp
    container_name: pdp
    volumes:
      - ./pdp:/app
      - ./wg_config:/config
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/zerotrust_db
      - ADMIN_USERNAME=laura.maris104121@gmail.com
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: zt_postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=zerotrust_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pep:
    build: ./frontend
    container_name: pep
    ports:
      - "8080:80"
    volumes:
      - ./pep/nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
volumes:
  postgres_data:
