server {
    listen 80;
    server_name localhost;

    # 1. API Gateway (MUST be first - takes precedence)
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://pdp:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # 2. Internal Auth Check
    location = /auth_check {
        internal;
        proxy_pass http://pdp:8000/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    # 3. Frontend Assets (Static files)
    location /assets/ {
        alias /usr/share/nginx/html/login_app/assets/;
    }
    
    location = /vite.svg {
        root /usr/share/nginx/html/login_app;
    }

    # 4. Login page - no auth required
    location = /login {
        alias /usr/share/nginx/html/login_app/;
        try_files /index.html =404;
    }
    
    # 5. Admin routes - require auth, serve SPA
    location /admin {
        auth_request /auth_check;
        error_page 401 = @handle_401;
        
        alias /usr/share/nginx/html/login_app/;
        try_files /index.html =404;
    }
    
    # 6. Dashboard route - require auth, serve SPA
    location /dashboard {
        auth_request /auth_check;
        error_page 401 = @handle_401;
        
        alias /usr/share/nginx/html/login_app/;
        try_files /index.html =404;
    }

    # 7. Protected content (default) - resource server
    location / {
        auth_request /auth_check;
        error_page 401 = @handle_401;
        proxy_pass http://resource_server;
    }
    
    location @handle_401 {
        return 302 /login;
    }
}
